<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF9F43">
<title>趣识字 AI · 阅读识字</title>
<style>
  :root{
    --orange:#FF9F43; --orange-d:#Fb8c00; --yellow:#FFD93D; --green:#6BCB77;
    --blue:#4D96FF; --pink:#FF6B9D; --purple:#9B59B6; --red:#FF6B6B;
    --bg:#FFF8EE; --card:#FFFFFF; --ink:#3D3D4D; --ink2:#6B6B7B; --line:#F0E6D6;
    --shadow:0 6px 18px rgba(255,159,67,.18); --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg); color:var(--ink); line-height:1.6;overscroll-behavior:none; user-select:none}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; box-shadow:0 0 40px rgba(0,0,0,.06)}
  .page{display:none; padding:16px 16px 92px; min-height:100vh}
  .page.active{display:block; animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .topbar{position:sticky; top:0; z-index:20; background:linear-gradient(135deg,var(--orange),var(--yellow));padding:14px 16px 12px; color:#fff; border-radius:0 0 22px 22px; box-shadow:var(--shadow)}
  .topbar h1{font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px}
  .topbar .sub{font-size:12px; opacity:.92; margin-top:2px}
  .topbar .avatar{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;float:right;margin-top:-30px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
  .card{background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px}
  .card h2{font-size:16px; margin-bottom:10px; display:flex; align-items:center; gap:6px}
  .card .more{margin-left:auto; font-size:12px; color:var(--orange-d); font-weight:600}
  .stats{display:flex; gap:10px; margin-bottom:14px}
  .stat{flex:1; background:var(--card); border-radius:14px; padding:12px 8px; text-align:center; box-shadow:var(--shadow)}
  .stat .num{font-size:22px; font-weight:800; color:var(--orange-d)}
  .stat .lbl{font-size:11px; color:var(--ink2); margin-top:2px}
  .btn{display:block; width:100%; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--orange),var(--orange-d)); box-shadow:0 5px 14px rgba(255,159,67,.4); cursor:pointer; transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff; color:var(--orange-d); box-shadow:var(--shadow)}
  .btn.green{background:linear-gradient(135deg,var(--green),#4CAF71); box-shadow:0 5px 14px rgba(107,203,119,.4)}
  .btn.blue{background:linear-gradient(135deg,var(--blue),#3A7BFF); box-shadow:0 5px 14px rgba(77,150,255,.4)}
  .btn.sm{padding:8px 14px; font-size:13px; width:auto; display:inline-block; border-radius:10px}
  .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;background:#fff; border-top:1px solid var(--line); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1; text-align:center; padding:8px 0 10px; cursor:pointer; color:var(--ink2); transition:color .2s}
  .tab .ic{font-size:22px; line-height:1.2}
  .tab .t{font-size:11px; font-weight:600}
  .tab.active{color:var(--orange-d)}
  .tab .ic{position:relative}
  .tab.active .ic{transform:translateY(-2px) scale(1.08); transition:transform .2s}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:#FFF1DC; color:var(--ink); border-radius:10px; padding:8px 12px; font-size:18px; font-weight:600; cursor:pointer; transition:all .15s}
  .chip.new{background:#FFE0E0; color:var(--red)}
  .chip.known{background:#E8F8EA; color:var(--green)}
  .chip:active{transform:scale(.92)}
  .book-list{display:flex; flex-direction:column; gap:12px}
  .book{display:flex; gap:12px; background:var(--card); border-radius:14px; padding:12px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s}
  .book:active{transform:scale(.98)}
  .book .cover{width:64px; height:64px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0}
  .book .info{flex:1; min-width:0}
  .book .info .ti{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .book .info .ds{font-size:12px; color:var(--ink2); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .book .badge{font-size:10px; padding:2px 7px; border-radius:8px; background:#FFF1DC; color:var(--orange-d); font-weight:600; align-self:flex-start; margin-top:4px}
  .read-img{font-size:80px;text-align:center;padding:6px 0;line-height:1.3;animation:pop .3s}.read-text{font-size:24px; line-height:2.2; text-align:justify; letter-spacing:1px}
  .read-text .w{display:inline-block; padding:2px 3px; border-radius:6px; cursor:pointer; transition:all .15s}
  .read-text .w.new{color:var(--red); font-weight:600; border-bottom:2px solid var(--red)}
  .read-text .w:active{background:#FFF1DC}
  .read-text .w.speak{background:#FFE9A8; animation:pop .4s}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
  .read-toolbar{display:flex; gap:8px; margin:16px 0; position:sticky; bottom:84px}
  .read-toolbar .btn{flex:1; padding:10px; font-size:14px}
  .progress{height:10px; background:#FFF1DC; border-radius:6px; overflow:hidden; margin:8px 0}
  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--orange),var(--yellow)); border-radius:6px; transition:width .5s}
  .pet-stage{background:linear-gradient(180deg,#BEE9FF 0%,#E8F8FF 60%,#FFF8EE 100%); border-radius:22px; padding:20px; text-align:center; position:relative; overflow:hidden; min-height:280px}
  .pet-stage .cloud{position:absolute; font-size:26px; opacity:.7; animation:drift 18s linear infinite; will-change:transform}
  .pet-stage .cloud:nth-child(2){top:30px; left:10%; animation-duration:24s}
  .pet-stage .cloud:nth-child(3){top:60px; right:8%; animation-duration:30s}
  @keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(330px)}}
  .pet-wrap{width:240px;height:240px;margin:10px auto;position:relative;z-index:2}
  .pet-img{width:220px;height:220px;object-fit:contain;animation:petBounce 2.2s ease-in-out infinite;transform-origin:bottom center;cursor:pointer;transition:filter .3s;will-change:transform}
  .pet-img:active{animation:petWiggle .5s ease}
  .pet-img.clicked{animation:petWiggle .5s ease}
  .pet-sparkle{position:absolute;font-size:20px;pointer-events:none;animation:sparkleFloat 2.5s ease-in-out infinite;will-change:transform,opacity}
  .pet-sparkle:nth-child(1){top:10px;left:30px;animation-delay:0s}
  .pet-sparkle:nth-child(2){top:30px;right:20px;animation-delay:.7s}
  .pet-sparkle:nth-child(3){bottom:40px;left:20px;animation-delay:1.4s}
  .pet-sparkle:nth-child(4){bottom:20px;right:30px;animation-delay:2s}
  @keyframes petBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.02)}}
  @keyframes petWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  @keyframes sparkleFloat{0%,100%{opacity:0;transform:translateY(0) scale(.5)}50%{opacity:1;transform:translateY(-15px) scale(1.2)}}
  .doll-stage{transition:transform .2s,box-shadow .2s;border-radius:20px}
  .doll-stage.drag-over{transform:scale(1.04);box-shadow:0 0 0 3px #FF9EB5,0 8px 24px rgba(255,158,181,.45)}
  .doll-ghost{position:fixed;width:120px;height:120px;object-fit:contain;pointer-events:none;z-index:9999;opacity:0;transition:opacity .15s,transform .12s;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
  .drag-doll{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  .drag-doll:active{cursor:grabbing}
  .doll-hint{font-size:12px;color:var(--ink2);text-align:center;margin-top:8px;opacity:.85}
  .pet-sparkle.burst{animation:sparkleBurst 1.4s ease-out forwards}
  @keyframes sparkleBurst{0%{opacity:0;transform:translateY(0) scale(.4)}30%{opacity:1;transform:translateY(-22px) scale(1.3)}100%{opacity:0;transform:translateY(-70px) scale(.5)}}
  .pet-name{font-size:18px; font-weight:800; color:var(--ink); margin-top:6px}
  .pet-lv{font-size:12px; color:var(--ink2); margin-top:2px}
  .pet-mood{font-size:13px; color:var(--orange-d); margin-top:4px; font-weight:600}
  .pet-shop-item{background:#FFF8EE;border-radius:14px;padding:10px;text-align:center;border:2px solid transparent;transition:all .15s}
  .pet-shop-item.owned{border-color:var(--green);background:#E8F8EE}
  .pet-shop-item.active{border-color:var(--orange);background:#FFF1DC}
  .pet-shop-item .pet-thumb{width:80px;height:80px;object-fit:contain;margin:0 auto 6px;border-radius:10px;background:#fff}
  .pet-shop-item .pet-label{font-size:12px;color:var(--ink2);margin-top:4px}
  .pet-shop-item .pet-cost{font-size:11px;margin-top:2px;color:var(--orange-d);font-weight:700}
  .pet-shop-item.locked{opacity:.55}
  .pet-chat-fab{position:absolute;bottom:12px;right:12px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),#FF8FAB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,157,.4);z-index:5}
  .pet-chat-bubble{position:absolute;top:-20px;left:50%;transform:translateX(-100%) rotate(-3deg);max-width:180px;background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:10;animation:bubbleIn .3s ease;white-space:pre-line}
  .pet-chat-bubble::after{content:'';position:absolute;right:-10px;top:20px;border-width:8px;border-style:solid;border-color:transparent transparent transparent #fff}
  @keyframes bubbleIn{from{opacity:0;transform:translateX(-80%) rotate(-3deg) scale(.8)}to{opacity:1;transform:translateX(-100%) rotate(-3deg) scale(1)}}
  .chat-panel{background:linear-gradient(180deg,#FFF8EE,#FFF1DC);border-radius:18px;padding:16px;margin-top:12px}
  .chat-msg{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:14px;line-height:1.5;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .chat-msg.me{background:var(--orange);color:#fff;margin-left:20px}
  .chat-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chat-quick .chip{background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;color:var(--orange-d);cursor:pointer;border:1px solid var(--orange);transition:all .15s}
  .chat-quick .chip:hover{background:var(--orange);color:#fff}
  .chat-input{display:flex;gap:8px;margin-top:10px}
  .chat-input input{flex:1;border:2px solid var(--line);border-radius:22px;padding:10px 16px;font-size:14px;background:#fff;outline:none}
  .chat-input input:focus{border-color:var(--orange)}
  .chat-input button{background:var(--orange);color:#fff;border:none;border-radius:22px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
  .mic-btn{background:linear-gradient(135deg,var(--pink),#FF6B9D);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
  .mic-btn.recording{background:linear-gradient(135deg,#FF4757,#FF6B81);animation:micPulse 1s ease-in-out infinite}
  .mic-btn:disabled{opacity:.5;cursor:not-allowed}
  @keyframes micPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{transform:scale(1.1);box-shadow:0 0 0 10px rgba(255,71,87,0)}}
  .voice-indicator{display:flex;align-items:center;gap:4px;padding:6px 0;font-size:12px;color:var(--orange-d);font-weight:600}
  .voice-bar{width:3px;height:12px;background:var(--pink);border-radius:2px;animation:voiceBar .6s ease-in-out infinite}
  .voice-bar:nth-child(2){animation-delay:.15s}
  .voice-bar:nth-child(3){animation-delay:.3s}
  .voice-bar:nth-child(4){animation-delay:.45s}
  .voice-bar:nth-child(5){animation-delay:.6s}
  @keyframes voiceBar{0%,100%{height:4px}50%{height:14px}}
  .chat-msg.voice{background:linear-gradient(135deg,#FFF1DC,#FFE4C4);border-left:3px solid var(--orange-d)}
  .chat-msg.ai-typing{background:#E8F8EE;border-left:3px solid var(--green);font-style:italic}
  .chat-msg.ai-typing::after{content:'...';animation:dots 1.4s infinite}
  @keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
  .ai-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-bottom:6px;cursor:pointer}
  .ai-toggle input{accent-color:var(--orange)}
  .api-key-row{display:flex;gap:6px;margin-bottom:6px}
  .api-key-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
  .api-key-row button{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}


  .acc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .acc-item{background:#FFF8EE; border-radius:14px; padding:12px 6px; text-align:center; cursor:pointer; border:2px solid transparent; transition:all .15s}
  .acc-item.locked{opacity:.45}
  .acc-item.equipped{border-color:var(--orange); background:#FFF1DC}
  .acc-item .em{font-size:30px}
  .acc-item .nm{font-size:11px; margin-top:4px; color:var(--ink2)}
  .acc-item .lock{font-size:10px; color:var(--ink2); margin-top:2px}
  .list{display:flex; flex-direction:column; gap:10px}
  .row{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; padding:12px; box-shadow:var(--shadow)}
  .row .ic{width:42px; height:42px; border-radius:12px; background:#FFF1DC; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0}
  .row .tx{flex:1; min-width:0}
  .row .tx .a{font-size:14px; font-weight:600}
  .row .tx .b{font-size:12px; color:var(--ink2)}
  .row .rt{font-size:13px; font-weight:700; color:var(--orange-d)}
  .test-char{font-size:96px; text-align:center; font-weight:800; padding:30px 0; color:var(--ink)}
  .test-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .test-opt{padding:16px; border-radius:14px; background:#fff; border:2px solid var(--line); font-size:15px; font-weight:600; cursor:pointer; transition:all .15s}
  .test-opt:active{transform:scale(.96)}
  .test-opt.right{border-color:var(--green); background:#E8F8EA; color:var(--green)}
  .test-opt.wrong{border-color:var(--red); background:#FFEEEE; color:var(--red)}
  .game-target{font-size:48px; text-align:center; font-weight:800; color:var(--orange-d); padding:10px}
  .game-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
  .game-cell{aspect-ratio:1; background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; cursor:pointer; box-shadow:var(--shadow); transition:all .15s}
  .game-cell:active{transform:scale(.92)}
  .game-cell.hit{background:#FFD93D; animation:pop .35s}
  .game-cell.bad{background:#FFEEEE}
  .chart{height:140px; background:#fff; border-radius:14px; padding:10px; position:relative; box-shadow:var(--shadow)}
  .chart svg{width:100%; height:100%}
  .tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .tag{padding:6px 14px; border-radius:20px; background:#fff; font-size:13px; color:var(--ink2); cursor:pointer; box-shadow:var(--shadow); transition:all .15s}
  .tag.active{background:var(--orange); color:#fff; font-weight:600}
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:center; justify-content:center; padding:20px}
  .mask.show{display:flex; animation:fade .25s}
  .modal{background:#fff; border-radius:22px; padding:24px 20px; max-width:380px; width:100%; text-align:center; animation:pop .3s}
  .modal .big{font-size:54px; margin-bottom:6px}
  .modal h3{font-size:19px; margin-bottom:8px}
  .modal p{font-size:14px; color:var(--ink2); margin-bottom:16px}
  .toast{position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#3D3D4D; color:#fff; padding:10px 18px; border-radius:30px; font-size:14px; z-index:60; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(4px)}
  .section-ti{font-size:15px; font-weight:800; margin:6px 0 10px; display:flex; align-items:center; gap:6px}
  .empty{text-align:center; padding:40px 16px; color:var(--ink2); font-size:14px}
  .pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
  .pill.r{background:#FFEEEE;color:var(--red)}
  .pill.g{background:#E8F8EA;color:var(--green)}
  .pill.o{background:#FFF1DC;color:var(--orange-d)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tap:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="mask" id="mask"></div>
<script>
const HANZI = [
  ["一","yī",1],["二","èr",1],["三","sān",1],["四","sì",1],["五","wǔ",1],["六","liù",1],["七","qī",1],["八","bā",1],["九","jiǔ",1],["十","shí",1],

  ["早","zǎo",2],["晚","wǎn",2],["今","jīn",2],["年","nián",2],["前","qián",2],["后","hòu",2],["左","zuǒ",2],["右","yòu",2],["里","lǐ",2],["外","wài",2],

const BOOKS = [
  {id:"b1",title:"小猫钓鱼",topic:"童话",level:1,emoji:"🐱",desc:"小猫和妈妈去河边钓鱼，可是它一会儿捉蜻蜓，一会儿扑蝴蝶……",text:["小猫和妈妈一起去河边钓鱼。","一只蜻蜓飞来了，小猫跑去捉蜻蜓。","蜻蜓飞走了，小猫空着手回来。","一只蝴蝶飞来了，小猫又去捉蝴蝶。","蝴蝶也飞走了，小猫还是空着手。","妈妈已经钓了一大筐鱼。","小猫说：我也要认真钓鱼！","这一次，蜻蜓和蝴蝶来了，小猫看也不看。","不一会儿，小猫也钓到了一条大鱼！"]},
  {id:"b2",title:"月亮的味道",topic:"童话",level:2,emoji:"🌙",desc:"小动物们想知道月亮是什么味道，它们叠高高去够月亮……",text:["小乌龟想：月亮是什么味道呢？","它爬到山顶，伸长脖子，够不到月亮。","大象来了，让小乌龟站在自己背上。","还是差一点点。","长颈鹿来了，站在大象身上。","还是够不到。","小老鼠来了，爬到最上面。","月亮累了，低了一点。","小老鼠咬了一口：月亮真甜啊！","它把月亮分给每一个朋友。"]},
  {id:"b3",title:"种子的旅行",topic:"科普",level:2,emoji:"🌱",desc:"一颗小种子离开妈妈，乘风、过河，找到新家长大。",text:["蒲公英妈妈的小种子成熟了。","一阵风吹来，种子飞上了天。","它飞过高高的山。","它飞过宽宽的河。","它看见一片松软的泥土。","种子落下来，钻进了泥土里。","下了一场雨，种子喝足了水。","太阳暖暖地照着它。","种子发芽了，长出两片小叶子。","它会长成一棵新的蒲公英。"]},
  {id:"b4",title:"三字经·人之初",topic:"国学",level:3,emoji:"📜",desc:"人之初，性本善，性相近，习相远。",text:["人之初，性本善。","性相近，习相远。","苟不教，性乃迁。","教之道，贵以专。","昔孟母，择邻处。","子不学，断机杼。","窦燕山，有义方。","教五子，名俱扬。"]},
  {id:"b5",title:"今天我当家",topic:"生活",level:2,emoji:"🍳",desc:"妈妈生病了，小红今天要当一次小当家。",text:["今天妈妈生病了，躺在床上休息。","小红说：今天我当家！","她先给妈妈倒了一杯温水。","然后她拿起扫帚，把地扫干净。","她学着妈妈的样子煮了一锅粥。","粥有点糊了，可是妈妈笑着说真香。","小红又给妈妈讲了一个故事。","妈妈说：我的小红长大了。","小红心里暖暖的。"]},
  {id:"b6",title:"小水滴的循环",topic:"科普",level:3,emoji:"💧",desc:"小水滴变成云、变成雨，又流回大海，循环不停。",text:["大海里有一颗小水滴。","太阳出来了，小水滴变暖变轻。","它飘上了天空，变成了一朵云。","云越聚越多，越来越重。","一阵冷风吹来，小水滴变成雨落下来。","它流进小河，小河流进大江。","大江又流回了大海。","小水滴的旅行，永远也不会停。"]},
  {id:"b7",title:"孔融让梨",topic:"国学",level:3,emoji:"🍐",desc:"孔融四岁就懂得把大梨让给哥哥弟弟。",text:["孔融四岁的时候，家里分梨吃。","他挑了一个最小的梨。","爸爸问他：为什么不拿大的？","孔融说：我年纪小，应该吃小的。","哥哥比我大，应该吃大的。","弟弟比我小，我也该让着他。","爸爸听了，笑了。","大家都夸孔融是个懂事的好孩子。"]},
  {id:"b8",title:"小蚂蚁搬家",topic:"科普",level:2,emoji:"🐜",desc:"要下雨啦，小蚂蚁们排队把粮食搬到高高的新家。",text:["天阴了，空气闷闷的。","蚂蚁妈妈说：快下雨了，我们要搬家。","小蚂蚁们排成长长的一队。","有的背着粮食，有的抱着宝宝。","它们爬上高高的土坡。","刚搬进新家，雨就哗哗地下起来。","新家在高处，雨水进不来。","小蚂蚁们又暖又干，真开心。"]},
  {id:"b9",title:"找春天",topic:"生活",level:2,emoji:"🌸",desc:"冬天过去了，我们一起去找春天在哪里。",text:["冬天过去了，春天来了吗？","我们去找一找。","小草从土里探出头，那是春天的眉毛吧？","树枝吐出嫩芽，那是春天的眼睛吧？","早开的小花一朵两朵，那是春天的脸颊吧？","小溪叮叮咚咚，那是春天在唱歌吧？","春天在枝头，春天在田野。","春天就在我们身边。"]},
  {id:"b10",title:"拔萝卜",topic:"童话",level:1,emoji:"🥕",desc:"老爷爷种的大萝卜拔不动，大家一起来帮忙。",text:["老爷爷种了一个大萝卜。","萝卜长大了，老爷爷拔不动。","他喊老奶奶来帮忙，还是拔不动。","老奶奶喊小孙女来帮忙，还是拔不动。","小孙女喊小狗来帮忙，还是拔不动。","小狗喊小猫来帮忙，还是拔不动。","小猫喊小老鼠来帮忙。","大家一起用力——拔出来了！","大伙儿开心地笑了。"]},
  {id:"b11",title:"笑一笑十年少",topic:"笑话",level:2,emoji:"😄",desc:"几个让人哈哈大笑的小笑话。",text:["老师问：什么东西早上四条腿，中午两条腿，晚上三条腿？","小明说：是白天没吃饱的人。","爸爸说：儿子，你要多动脑。","儿子说：那我躺着想可以吗？","小猫问小狗：你为什么摇尾巴？","小狗说：因为我没有手可以拍手啊。","笑一笑，十年少，天天开心最好。"]},
  {id:"b12",title:"星星的秘密",topic:"科普",level:3,emoji:"⭐",desc:"天上的星星为什么会眨眼睛？它们离我们有多远？",text:["晚上，天上有很多很多的星星。","星星一闪一闪，好像在眨眼睛。","其实，是空气在让它们眨眼。","空气会流动，让星光一会儿强一会儿弱。","星星离我们非常非常远。","有的光要走很多年才能到我们眼里。","有些星星比太阳还大还亮。","它们组成了美丽的银河。"]},{id:"b13",title:"屁屁侦探找内裤",topic:"屎尿屁",level:1,emoji:"🔍",desc:"屁屁侦探用屁股的能量破案，帮小猪找回丢失的内裤。",text:["屁屁侦探有一个厉害的屁股。","屁股一翘，就能闻出坏蛋的味道。","今天小猪哭着来找他：我的内裤不见了！","屁屁侦探说：别急，我来帮你找。","他翘起屁股，闻了闻空气。","嗯，有一股臭臭的味道，往东边去了。","他顺着味道，找到一棵大树后面。","树后，一只小老鼠正穿着内裤发呆。","小老鼠说：对不起，我以为这是我的。","屁屁侦探笑了，帮他们又做了一条新内裤。"]},{id:"b14",title:"谁放了那个屁",topic:"屎尿屁",level:1,emoji:"💨",desc:"公共场合一个响屁，大家互相猜，最后发现是小猪放的。",text:["大家坐在一起听故事。","忽然，噗——一个响屁。","好臭好臭！是谁放的？","小猫说：不是我，我刚才在张嘴。","小狗说：不是我，我刚吃饱。","小猪脸红了，低下了头。","大家看着小猪。","小猪说：对不起，是我放的。","老师说：放屁很正常，不用害羞。","大家都笑了，继续听故事。"]},{id:"b15",title:"拉粑粑大王",topic:"屎尿屁",level:2,emoji:"🚽",desc:"小动物们比赛拉粑粑，学习如厕好习惯。",text:["小动物们比赛：谁是拉粑粑大王。","小狗每天早上准时去厕所。","小猫会用马桶，还会冲水。","小猪吃了很多菜，拉得很顺畅。","小兔吃完早饭，坐上小马桶。","噗噗噗，拉出金黄的粑粑。","用纸擦干净，穿上裤子。","冲水，洗手，真干净。","医生说：多吃菜，多喝水，定时拉粑粑。","大家都是拉粑粑大王！"]},{id:"b16",title:"屁的秘密",topic:"屎尿屁",level:2,emoji:"💨",desc:"为什么会放屁？吃豆子为什么爱放屁？一起揭开屁的秘密。",text:["你放过屁吗？屁是什么？","屁是肚子里的气。","我们吃东西时，会吃进一些空气。","豆子里的气特别多。","气在肚子里越聚越多。","等到聚多了，就要跑出来。","从屁股跑出来，就是屁。","有的屁响，有的屁不响。","有的屁臭，有的屁不臭。","放屁是身体在说话，很正常。"]},{id:"b17",title:"尿床小英雄",topic:"屎尿屁",level:2,emoji:"🛏️",desc:"小象尿床了不害羞，慢慢练习，做个勇敢的小英雄。",text:["小象今天不开心。","因为他晚上尿床了。","妈妈晒被子，没有骂他。","妈妈说：小时候都会尿床。","长大了，就不会了。","小象问：什么时候才长大？","妈妈说：每天少喝一点水，睡前去尿尿。","慢慢地，膀胱变大，就不尿床了。","小象不害羞了，努力练习。","他真是个勇敢的小英雄。"]},{id:"b18",title:"是谁嗯嗯在头上",topic:"屎尿屁",level:2,emoji:"💩",desc:"小鼹鼠头上被拉了一坨嗯嗯，到处找是谁干的。",text:["小鼹鼠从地下钻出来。","忽然，一坨嗯嗯掉在他头上。","好臭！是谁拉的？","他问小猪：是你拉的吗？","小猪拉了一坨给他看：不是，我的不是这个样。","他问小羊：是你拉的吗？","小羊拉了一坨：不是，我的像豆豆。","他问小牛：是你拉的吗？","小牛拉了一大坨：不是，我的太多啦。","鸽子飞来说：我看见了，是小狗拉的！","小鼹鼠找到小狗，噗，也在他头上拉了一坨。","哈哈，扯平啦！"]}

const TTS={
  voice:null, ready:false, voices:[],
  init(){
    if(!('speechSynthesis' in window)){return}
    const load=()=>{ this.voices=speechSynthesis.getVoices(); this.pickFemale(); this.ready=true; };
    load(); speechSynthesis.onvoiceschanged=load;
  },
  pickFemale(){
    const vs=this.voices||[];
    const fKw=['female','女','ting','xiaoxiao','xiaoyi','mei','hui','yaoyao','sinji','meijia','lihui','xiaomei','kangkang','yating'];
    const mKw=['male','男','yunxi','yunyang','yunfeng','yunhao','yunjian','walle'];
    const zh=vs.filter(v=>/zh|cmn|chinese/i.test(v.lang)||/chinese/i.test(v.name));
    const pool=zh.length?zh:vs;
    let pick=pool.find(v=>fKw.some(k=>(v.name||'').toLowerCase().includes(k)));
    if(!pick) pick=pool.find(v=>!mKw.some(k=>(v.name||'').toLowerCase().includes(k)));
    if(!pick) pick=pool[0];
    this.voice=pick||null;
  },
  speak(text){
    if(!('speechSynthesis' in window)){toast('浏览器不支持语音');return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';
    const isSingle=/^[\u4e00-\u9fa5]{1}$/.test(text);
    u.rate=isSingle?0.82:0.92;
    u.pitch=1.25;
    u.volume=1;
    if(this.voice) u.voice=this.voice;
    speechSynthesis.speak(u);
  },
  voiceName(){ return this.voice ? this.voice.name : '(系统默认)'; }
};
function recommendBooks(n){

  scored.sort((a,b)=>{ const A=a.newCnt, B=b.newCnt; const inA=A<=10, inB=B<=10; if(inA&&!inB) return -1; if(!inA&&inB) return 1; return Math.abs(A-5)-Math.abs(B-5); });
  return scored.slice(0,n);
}

function cloudSpeak(text){
  if(cloudAudioCache[text]){ try{new Audio(cloudAudioCache[text]).play();}catch(e){} return; }
  const isSingle=/^[\u4e00-\u9fa5]{1}$/.test(text);
  const body=JSON.stringify({input:text, voice:S.cloudVoice||'zh-CN-XiaoxiaoNeural', speed:isSingle?0.85:1.0, pitch:'0', style:'general'});
  fetch('https://tts.wangwangit.com/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
    .then(r=>{ if(!r.ok) throw new Error('tts '+r.status); return r.blob(); })
    .then(blob=>{ const u=URL.createObjectURL(blob); cloudAudioCache[text]=u; try{new Audio(u).play();}catch(e){} })
    .catch(e=>{ console.warn('cloud tts fail, fallback',e); TTS.speak(text); });
}
function cloudPrefetch(text){
  if(!text||cloudAudioCache[text]||S.ttsEngine!=='cloud')return;
  const body=JSON.stringify({input:text, voice:S.cloudVoice||'zh-CN-XiaoxiaoNeural', speed:1.0, pitch:'0', style:'general'});

}

function bindDollDrag(){

function startDollDrag(e,item){
  const id=item.dataset.id;
  const isOwned=item.dataset.owned==='true';
  const cost=parseInt(item.dataset.cost)||0;
  const name=item.dataset.name||'';
  const emoji=item.dataset.emoji||'';
  if(!isOwned && S.petExp<cost){ toast('需要'+cost+'积分才能解锁 '+emoji+name); return; }
  e.preventDefault();
  const imgEl=item.querySelector('img');
  const ghost=document.createElement('img');
  ghost.className='doll-ghost';
  ghost.src=imgEl.src;
  document.body.appendChild(ghost);
  dollDrag={id:id,isOwned:isOwned,cost:cost,name:name,emoji:emoji,ghost:ghost,startX:e.clientX,startY:e.clientY,moved:false};
  const moveHandler=function(ev){
    if(!dollDrag)return;
    const dx=ev.clientX-dollDrag.startX, dy=ev.clientY-dollDrag.startY;
    if(Math.abs(dx)>6||Math.abs(dy)>6)dollDrag.moved=true;
    dollDrag.ghost.style.left=(ev.clientX-60)+'px';
    dollDrag.ghost.style.top=(ev.clientY-60)+'px';
    dollDrag.ghost.style.opacity='0.9';
    dollDrag.ghost.style.transform='scale(1.1) rotate(-5deg)';
    const stage=document.getElementById('dollStage');
    if(stage){ const r=stage.getBoundingClientRect(); const inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom; stage.classList.toggle('drag-over',inside); }
  };
  const upHandler=function(ev){
    document.removeEventListener('pointermove',moveHandler);
    document.removeEventListener('pointerup',upHandler);
    document.removeEventListener('pointercancel',upHandler);
    if(!dollDrag)return;
    const stage=document.getElementById('dollStage');
    let dropped=false;
    if(stage){ const r=stage.getBoundingClientRect(); if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)dropped=true; stage.classList.remove('drag-over'); }
    if(dropped){ doDollSwitch(dollDrag); }
    else if(!dollDrag.moved){ if(dollDrag.isOwned){ switchDoll(dollDrag.id); } else { unlockDoll(dollDrag.id); } }
    if(dollDrag.ghost)dollDrag.ghost.remove();
    dollDrag=null;
  };
  document.addEventListener('pointermove',moveHandler);
  document.addEventListener('pointerup',upHandler);
  document.addEventListener('pointercancel',upHandler);
}
function doDollSwitch(d){

    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var data=await resp.json();
    var reply=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'嗯嗯…我想想…';
    aiChatHistory.push({role:'assistant',content:reply});
    if(typing){typing.remove()}
    if(panel){var msg=document.createElement('div');msg.className='chat-msg';msg.textContent=reply;panel.querySelector('.chat-msgs').appendChild(msg)}
    petSay(reply);
  }catch(e){
    console.warn('AI call failed',e);
    if(typing){typing.remove()}
    var fallback=petChatReply(text);
    if(panel){var msg=document.createElement('div');msg.className='chat-msg';msg.textContent='(AI离线) '+fallback;panel.querySelector('.chat-msgs').appendChild(msg)}
    petSay(fallback);
  }
}

var petImgCache={};
function petImgLoad(img, tolerance){
  if(img.dataset.done)return;
  tolerance = tolerance || 25;
  var orig = img.src;
  if(petImgCache[orig]){ img.dataset.done='1'; img.src=petImgCache[orig]; return; }
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  c.width = img.naturalWidth || 220; c.height = img.naturalHeight || 220;
  ctx.drawImage(img, 0, 0);
  try{
    var d = ctx.getImageData(0, 0, c.width, c.height);
    var px = d.data;
    for(var i = 0; i < px.length; i += 4){
      var r = px[i], g = px[i+1], b = px[i+2];
      var maxEdge = Math.max(255-r, 255-g, 255-b);
      if(maxEdge < tolerance){ px[i+3] = 0; }
      else if(maxEdge < tolerance*2){ px[i+3] = Math.round((maxEdge-tolerance)/tolerance*255); }
    }
    ctx.putImageData(d, 0, 0);
    var out = c.toDataURL('image/png');
    petImgCache[orig] = out;
    img.dataset.done='1';
    img.src = out;
  }catch(e){}
}

RENDER.growth=()=>{
  const wc=wordsCount();
  const hist=S.history.filter((_,i)=>i%Math.max(1,Math.floor(S.history.length/30))===0 || i===S.history.length-1);
  const max=Math.max(1, ...hist.map(h=>h.words)); const W=200; const H=140; const pad=10;
  const pts=hist.map((p,i)=>{ const x=pad + (i/Math.max(1,hist.length-1))*(W-pad*2); const y=H-pad - (p.words/max)*(H-pad*2); return [x,y]; });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const area=pts.length?path+' L'+pts[pts.length-1][0]+' '+(H-pad)+' L'+pts[0][0]+' '+(H-pad)+' Z':'';
  return '<div class="topbar"><h1>📈 成长档案</h1><div class="sub">AI量化阅读 · 成长可见</div><div class="avatar">📈</div></div><div style="padding:16px 16px 92px"><div class="stats"><div class="stat"><div class="num">'+wc+'</div><div class="lbl">总识字量</div></div><div class="stat"><div class="num">'+S.readMinutes+'</div><div class="lbl">阅读(分)</div></div><div class="stat"><div class="num">'+S.readBooks.length+'</div><div class="lbl">绘本本数</div></div><div class="stat"><div class="num">'+S.streak+'</div><div class="lbl">连续天数</div></div></div><div class="card"><div class="section-ti">📊 识字量成长曲线</div><div class="chart"><svg viewBox="0 0 200 140" preserveAspectRatio="none"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity="0.4"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient></defs>'+(pts.length?'<path d="'+area+'" fill="url(#g1)"/>':'')+'<path d="'+path+'" fill="none" stroke="#FF9F43" stroke-width="2.5" stroke-linejoin="round"/>'+(pts.length?pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.5" fill="#Fb8c00"/>').join(''):'')+'</svg></div><p style="font-size:12px;color:var(--ink2);margin-top:6px">从 0 字成长到 '+wc+' 字，继续加油！</p></div><div class="card"><div class="section-ti">🆕 最近学会</div><div class="chips">'+(S.known.slice(-24).map(c=>'<span class="chip known">'+c+'</span>').join('')||'<span style="color:var(--ink2);font-size:13px">还没有学会的字，去读绘本吧</span>')+'</div></div><div class="card"><div class="section-ti">📖 阅读记录</div><div class="list">'+(S.readBooks.length?S.readBooks.slice(-5).reverse().map(id=>{const b=BOOKS.find(x=>x.id===id);return '<div class="row"><div class="ic" style="background:'+topicColor(b.topic)+'">'+b.emoji+'</div><div class="tx"><div class="a">'+b.title+'</div><div class="b">'+b.topic+' · 已读完</div></div><div class="rt">✅</div></div>'}).join(''):'<div class="empty">还没有阅读记录</div>')+'</div></div></div>';
  setTimeout(function(){if(!document.getElementById('chatPanel'))renderChatPanel()},150);
};
